name: Deploy to Firebase Hosting on push to main
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Firebase Tools
        run: npm install -g firebase-tools
        
      # === AJUSTE CRÍTICO AQUI ===
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project tvdealuguer # Comando Limpo
        env:
          # Usamos o token secreto que o Firebase CLI adicionou ao GitHub
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TVDEALUGUER }}