name: Deploy to Firebase Hosting on push to main
'on':
  push:
    branches:
      - main
jobs:
    build_and_deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            
            - name: Install Firebase Tools
              run: npm install -g firebase-tools
              
            # === CORREÇÃO FINAL AQUI ===
            - name: Deploy to Firebase Hosting
              # Adicionamos o 'site tvdealuguer' para resolver o erro 'site name missing'
              run: firebase deploy --only hosting --project tvdealuguer --site tvdealuguer
              env:
                FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TVDEALUGUER }}