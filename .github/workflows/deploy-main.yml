name: Deploy to Firebase Hosting on push to main
'on':
  push:
    branches:
      - main
jobs:
    build_and_deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            
            - name: Install Firebase Tools
              run: npm install -g firebase-tools
              
            # === COMANDO FINAL E CORRETO ===
            - name: Deploy to Firebase Hosting
              # Usa apenas o Project ID, o que deve ser suficiente,
              # já que o Site ID é o mesmo: tvdealuguer
              run: firebase deploy --only hosting --project tvdealuguer 
              env:
                FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TVDEALUGUER }}