name: Deploy to Firebase Hosting on push to main
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. AUTENTICAÇÃO OFICIAL: Usa a ação do Google para autenticar com o Service Account JSON
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TVDEALUGUER }}'

      # 2. CONFIGURAÇÃO DO AMBIENTE NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. INSTALAR FERRAMENTAS
      - name: Install Firebase Tools
        run: npm install -g firebase-tools
        
      # 4. DEPLOY FINAL
      - name: Deploy to Firebase Hosting
        # O comando é limpo. A autenticação é feita pelo passo 1. O alvo é resolvido pelo firebase.json.
        run: firebase deploy --only hosting --project tvdealuguer